<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazarys</title>
<style>
  :root { --bg:#0b0b0c; --fg:#e8e8ea; --muted:#8a8a90; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:rgba(11,11,12,.85); backdrop-filter:blur(8px); }
  header b { letter-spacing:.08em; text-transform:uppercase; font-size:13px; }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--fg); }
  main { display:flex; flex-direction:column; align-items:center; gap:24px; padding:16px 16px 48px; }
  canvas { width:100%; max-width:1400px; height:auto; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#151517; aspect-ratio:1024.5/576; }
  #status { color:var(--muted); padding:40px; }
</style>
</head>
<body>
<header><b>Lazarys</b><a href="lazarys10.pdf" download>Download PDF ↓</a></header>
<main id="pages"><p id="status">Loading…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const main = document.getElementById("pages");
  pdfjsLib.getDocument("lazarys10.pdf").promise.then(async pdf => {
    document.getElementById("status").remove();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const canvases = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const c = document.createElement("canvas"); main.appendChild(c); canvases.push(c);
    }
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(1400, main.clientWidth) / base.width * dpr;
      const vp = page.getViewport({ scale });
      const c = canvases[i - 1];
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  }).catch(() => {
    document.getElementById("status").innerHTML = 'Couldn’t render. <a href="lazarys10.pdf" style="color:inherit">Open the PDF</a>';
  });
</script>
</body>
</html>
